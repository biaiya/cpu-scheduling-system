<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | CPU Scheduling System</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/transition.css">
    <link rel="stylesheet" href="../css/base.css">
</head>

<body>
    <div class="page">

        <section class="brand-panel">
            <div>
                <h1>CPU Scheduling System</h1>
                <p>College of Engineering and Architecture</p>
            </div>
        </section>

        <section class="form-panel">
            <form class="form-box" id="loginForm">
                <h2>Sign in now!</h2>

                <label for="student_id">Student ID</label>
                <input type="text" id="student_id" name="student_id" placeholder="2021-00123"
                    autocomplete="username" autofocus required>

                <label for="password">Password</label>
                <div class="field">
                    <input type="password" id="password" name="password" placeholder="••••••••"
                        autocomplete="current-password" required>
                    <button type="button" class="eye" aria-label="Show password"></button>
                </div>

                <p id="message" class="message"></p>

                <button type="submit">Sign in</button>

                <p class="switch">No account yet? <a href="signup.html">Create an account</a></p>
            </form>
        </section>

    </div>

    <script src="../js/transition.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/password.js"></script>
</body>

</html>
