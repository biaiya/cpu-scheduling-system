<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | CPU Scheduling System</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/transition.css">
    <link rel="stylesheet" href="../css/base.css">
</head>

<body>
    <div class="page">

        <section class="brand-panel">
            <div class="art">
                <div class="rows">
                    <div class="row"><i class="b1" style="width:30%"></i><i class="b2" style="width:18%"></i><i
                            class="b3" style="width:40%"></i><i class="sp" style="width:9%"></i></div>
                    <div class="row"><i class="sp" style="width:12%"></i><i class="b2" style="width:34%"></i><i
                            class="b1" style="width:22%"></i><i class="b4" style="width:20%"></i></div>
                    <div class="row"><i class="b3" style="width:44%"></i><i class="b4" style="width:26%"></i><i
                            class="b1" style="width:18%"></i></div>
                    <div class="row"><i class="b4" style="width:20%"></i><i class="b1" style="width:30%"></i><i
                            class="b2" style="width:34%"></i><i class="sp" style="width:14%"></i></div>
                    <div class="row"><i class="sp" style="width:6%"></i><i class="b1" style="width:36%"></i><i
                            class="b3" style="width:16%"></i><i class="b2" style="width:32%"></i></div>
                    <div class="row"><i class="sp" style="width:8%"></i><i class="b3" style="width:28%"></i><i
                            class="b4" style="width:30%"></i><i class="b1" style="width:24%"></i><i class="sp"
                            style="width:7%"></i></div>
                    <div class="row"><i class="b2" style="width:40%"></i><i class="b1" style="width:20%"></i><i
                            class="b3" style="width:28%"></i></div>
                    <div class="row"><i class="b1" style="width:16%"></i><i class="b4" style="width:38%"></i><i
                            class="b2" style="width:26%"></i><i class="sp" style="width:11%"></i></div>
                    <div class="row"><i class="sp" style="width:10%"></i><i class="b3" style="width:32%"></i><i
                            class="b2" style="width:24%"></i><i class="b1" style="width:30%"></i></div>
                    <div class="row"><i class="b4" style="width:22%"></i><i class="b1" style="width:36%"></i><i
                            class="b3" style="width:26%"></i></div>
                    <div class="row"><i class="b2" style="width:26%"></i><i class="b3" style="width:34%"></i><i
                            class="b1" style="width:24%"></i><i class="sp" style="width:13%"></i></div>
                    <div class="row"><i class="sp" style="width:10%"></i><i class="b1" style="width:30%"></i><i
                            class="b4" style="width:28%"></i><i class="b2" style="width:22%"></i></div>
                    <div class="row"><i class="b3" style="width:24%"></i><i class="b4" style="width:32%"></i><i
                            class="b1" style="width:30%"></i><i class="sp" style="width:8%"></i></div>
                    <div class="row"><i class="sp" style="width:7%"></i><i class="b1" style="width:34%"></i><i
                            class="b2" style="width:20%"></i><i class="b3" style="width:30%"></i><i class="sp"
                            style="width:10%"></i></div>
                </div>

                <svg class="chip" viewBox="0 0 180 180" role="img" aria-label="CPU chip">
                    <g stroke="#F2C14E" stroke-width="3" stroke-linecap="round" fill="none">
                        <rect x="35" y="35" width="110" height="110" rx="18" />
                        <line x1="62" y1="35" x2="62" y2="8" />
                        <line x1="90" y1="35" x2="90" y2="8" />
                        <line x1="118" y1="35" x2="118" y2="8" />
                        <line x1="62" y1="145" x2="62" y2="172" />
                        <line x1="90" y1="145" x2="90" y2="172" />
                        <line x1="118" y1="145" x2="118" y2="172" />
                        <line x1="35" y1="62" x2="8" y2="62" />
                        <line x1="35" y1="90" x2="8" y2="90" />
                        <line x1="35" y1="118" x2="8" y2="118" />
                        <line x1="145" y1="62" x2="172" y2="62" />
                        <line x1="145" y1="90" x2="172" y2="90" />
                        <line x1="145" y1="118" x2="172" y2="118" />
                    </g>
                    <g fill="#F2C14E">
                        <circle cx="62" cy="8" r="4.5" />
                        <circle cx="90" cy="8" r="4.5" />
                        <circle cx="118" cy="8" r="4.5" />
                        <circle cx="62" cy="172" r="4.5" />
                        <circle cx="90" cy="172" r="4.5" />
                        <circle cx="118" cy="172" r="4.5" />
                        <circle cx="8" cy="62" r="4.5" />
                        <circle cx="8" cy="90" r="4.5" />
                        <circle cx="8" cy="118" r="4.5" />
                        <circle cx="172" cy="62" r="4.5" />
                        <circle cx="172" cy="90" r="4.5" />
                        <circle cx="172" cy="118" r="4.5" />
                    </g>
                    <rect x="55" y="55" width="70" height="70" rx="8" fill="#F2C14E" />
                    <text x="90" y="96" text-anchor="middle" font-size="17" fill="#FFF6DC"
                        font-family="Georgia, serif">CPU</text>
                </svg>
            </div>

            <div>
                <h1>CPU Scheduling System</h1>
                <p>College of Engineering and Architecture</p>
            </div>
        </section>

        <section class="form-panel">
            <form class="form-box" id="loginForm">
                <h2>Sign in now!</h2>

                <label for="student_id">Student ID</label>
                <input type="text" id="student_id" name="student_id" placeholder="2021-00123" autocomplete="username"
                    autofocus required>

                <label for="password">Password</label>
                <div class="field">
                    <input type="password" id="password" name="password" placeholder="••••••••"
                        autocomplete="current-password" required>
                    <button type="button" class="eye" aria-label="Show password"></button>
                </div>

                <p id="message" class="message"></p>

                <button type="submit">Sign in</button>

                <p class="switch">No account yet? <a href="signup.html">Create an account</a></p>
            </form>
        </section>

    </div>

    <script src="../js/transition.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/password.js"></script>
</body>

</html>
